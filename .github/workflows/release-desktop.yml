name: Release Desktop

on:
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (universal, unsigned beta)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # --- Derive the bare version from the tag once so later steps
      # --- can embed it into the update manifest without reparsing.
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (version $VERSION)"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Tauri's `generate_context!` macro validates `frontendDist` at compile
      # time, so the Vite build has to land before `cargo tauri build` runs.
      - name: Build frontend
        run: pnpm --filter @focrel/desktop build

      - name: Build universal macOS DMG
        working-directory: apps/desktop
        env:
          # Update-signing (NOT Apple code-signing). This key pair verifies
          # the tar.gz bundle downloaded by tauri-plugin-updater; the public
          # half lives in tauri.conf.json, the private half in this secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code-signing env vars are deliberately unset for the beta.
          # When we enroll in the Apple Developer Program we'll add:
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          #   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # (see tauri-action readme for semantics) and flip `signingIdentity`
          # in tauri.conf.json.
        run: pnpm tauri build --target universal-apple-darwin

      # --- Capture the built artefacts so later steps can read them by path
      # --- without hunting around Tauri's deeply-nested bundle dir.
      - name: Collect bundle artefacts
        id: bundle
        run: |
          set -euo pipefail
          BUNDLE_DIR="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          DMG_PATH="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' | head -n1)"
          TAR_PATH="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app.tar.gz' | head -n1)"
          SIG_PATH="${TAR_PATH}.sig"

          if [[ -z "$DMG_PATH" || -z "$TAR_PATH" || ! -f "$SIG_PATH" ]]; then
            echo "::error::Missing bundle artefact. dmg=$DMG_PATH tar=$TAR_PATH sig=$SIG_PATH"
            exit 1
          fi

          echo "dmg=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "tar=$TAR_PATH" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG_PATH" >> "$GITHUB_OUTPUT"

      # --- Build a human-readable changelog from commits since the last
      # --- desktop-v* tag. Grouped by Conventional-Commit type. Feeds both
      # --- the Release body AND the updater's in-app "what's new" banner.
      - name: Generate changelog
        run: node scripts/release-notes.mjs

      # --- Build the update manifest (latest.json) the updater fetches on
      # --- every launch. URLs point at the R2 bucket (public), so the
      # --- Tauri updater and the /download page can both fetch anonymously
      # --- even though the GitHub repo stays private.
      - name: Generate latest.json
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          DMG_PATH='${{ steps.bundle.outputs.dmg }}'
          TAR_PATH='${{ steps.bundle.outputs.tar }}'
          SIG_PATH='${{ steps.bundle.outputs.sig }}'
          DMG_NAME="$(basename "$DMG_PATH")"
          TAR_NAME="$(basename "$TAR_PATH")"
          SIG_CONTENT="$(cat "$SIG_PATH")"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DMG_SIZE="$(stat -f%z "$DMG_PATH")"

          BASE='${{ secrets.UPDATES_BASE_URL }}'
          if [[ -z "$BASE" ]]; then
            echo "::error::secret UPDATES_BASE_URL is not set (see RELEASING.md)"
            exit 1
          fi
          # Trim a trailing slash so `${BASE}/foo` is always well-formed.
          BASE="${BASE%/}"
          TAR_URL="${BASE}/${TAG}/${TAR_NAME}"
          DMG_URL="${BASE}/${TAG}/${DMG_NAME}"

          # Custom fields (dmg, tag_name) sit alongside Tauri's required
          # shape — the updater ignores unknown keys, and /download reads
          # them for the version/size badge + download button URL.
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg pub_date "$PUB_DATE" \
            --arg tar_url "$TAR_URL" \
            --arg dmg_url "$DMG_URL" \
            --arg sig "$SIG_CONTENT" \
            --argjson dmg_size "$DMG_SIZE" \
            --rawfile notes RELEASE_NOTES.md \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-x86_64": { signature: $sig, url: $tar_url },
                "darwin-aarch64": { signature: $sig, url: $tar_url }
              },
              dmg: { url: $dmg_url, size_bytes: $dmg_size },
              tag_name: $tag
            }' > latest.json

          echo "--- latest.json ---"
          cat latest.json

      # --- Publish the DMG + updater tarball + signature + manifest to the
      # --- public R2 bucket. Versioned assets get immutable cache (we
      # --- never overwrite a version's bytes), latest.json gets a short
      # --- TTL so new releases propagate within a minute.
      - name: Upload artefacts to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          DMG_PATH='${{ steps.bundle.outputs.dmg }}'
          TAR_PATH='${{ steps.bundle.outputs.tar }}'
          SIG_PATH='${{ steps.bundle.outputs.sig }}'
          DMG_NAME="$(basename "$DMG_PATH")"
          TAR_NAME="$(basename "$TAR_PATH")"
          SIG_NAME="$(basename "$SIG_PATH")"
          BUCKET='${{ secrets.CLOUDFLARE_R2_BUCKET }}'

          put() {
            local key="$1"
            local file="$2"
            local ctype="$3"
            local cache="$4"
            pnpm dlx wrangler@4 r2 object put \
              "${BUCKET}/${key}" \
              --file="$file" \
              --content-type="$ctype" \
              --cache-control="$cache" \
              --remote
          }

          # Versioned — immutable, aggressive cache. One-year max-age.
          put "${TAG}/${DMG_NAME}" "$DMG_PATH" "application/x-apple-diskimage" "public,max-age=31536000,immutable"
          put "${TAG}/${TAR_NAME}" "$TAR_PATH" "application/gzip"               "public,max-age=31536000,immutable"
          put "${TAG}/${SIG_NAME}" "$SIG_PATH" "text/plain"                     "public,max-age=31536000,immutable"

          # Manifest — short TTL so clients see new releases within ~1min.
          put "latest.json" "latest.json" "application/json" "public,max-age=60"

      # --- Also mirror to a GitHub Release so `gh release list` + the
      # --- workflow summary page keep showing the artefacts. Clients
      # --- never hit these URLs (updater + /download use R2) — this is
      # --- purely for our own inspection convenience.
      - name: Mirror to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Focrel ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          # body_path wins over generate_release_notes when both are set,
          # so our grouped changelog replaces GitHub's auto-generated one.
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.bundle.outputs.dmg }}
            ${{ steps.bundle.outputs.tar }}
            ${{ steps.bundle.outputs.sig }}
            latest.json

      # --- Nudge Cloudflare Pages to redeploy so /download picks up the
      # --- new version by pinging the existing deploy-web workflow with
      # --- a workflow_dispatch.
      - name: Trigger web redeploy
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy-web.yml',
                ref: 'main',
              });
              core.info('Dispatched deploy-web.yml on main');
            } catch (e) {
              core.warning(`Could not dispatch deploy-web.yml: ${e.message}`);
            }
