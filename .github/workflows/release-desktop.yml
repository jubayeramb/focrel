name: Release Desktop

on:
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Needed for the final "Trigger web redeploy" step to call
  # workflow_dispatch on deploy-web.yml via GITHUB_TOKEN. Without this
  # the REST call 403s silently and the web never rebuilds post-release.
  actions: write

jobs:
  build-macos:
    name: Build macOS (universal, unsigned beta)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # --- Derive the bare version from the tag once so later steps
      # --- can embed it into the update manifest without reparsing.
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (version $VERSION)"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Tauri's `generate_context!` macro validates `frontendDist` at compile
      # time, so the Vite build has to land before `cargo tauri build` runs.
      - name: Build frontend
        run: pnpm --filter @focrel/desktop build

      - name: Build universal macOS DMG
        working-directory: apps/desktop
        env:
          # Update-signing (NOT Apple code-signing). This key pair verifies
          # the tar.gz bundle downloaded by tauri-plugin-updater; the public
          # half lives in tauri.conf.json, the private half in this secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code-signing env vars are deliberately unset for the beta.
          # When we enroll in the Apple Developer Program we'll add:
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          #   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # (see tauri-action readme for semantics) and flip `signingIdentity`
          # in tauri.conf.json.
        run: pnpm tauri build --target universal-apple-darwin

      # --- Capture the built artefacts so later steps can read them by path
      # --- without hunting around Tauri's deeply-nested bundle dir.
      - name: Collect bundle artefacts
        id: bundle
        run: |
          set -euo pipefail
          BUNDLE_DIR="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          DMG_PATH="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' | head -n1)"
          TAR_PATH="$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app.tar.gz' | head -n1)"
          SIG_PATH="${TAR_PATH}.sig"

          if [[ -z "$DMG_PATH" || -z "$TAR_PATH" || ! -f "$SIG_PATH" ]]; then
            echo "::error::Missing bundle artefact. dmg=$DMG_PATH tar=$TAR_PATH sig=$SIG_PATH"
            exit 1
          fi

          echo "dmg=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "tar=$TAR_PATH" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG_PATH" >> "$GITHUB_OUTPUT"

      # --- Build a human-readable changelog from commits since the last
      # --- desktop-v* tag. Grouped by Conventional-Commit type. Feeds both
      # --- the Release body AND the updater's in-app "what's new" banner.
      - name: Generate changelog
        run: node scripts/release-notes.mjs

      # --- Build the update manifest (latest.json) the updater fetches on
      # --- every launch. Asset URLs reference the public mirror repo
      # --- (`jubayeramb/focrel-releases`) so the Tauri updater and the
      # --- /download page can both fetch anonymously even though the
      # --- source repo stays private.
      - name: Generate latest.json
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          DMG_PATH='${{ steps.bundle.outputs.dmg }}'
          TAR_PATH='${{ steps.bundle.outputs.tar }}'
          SIG_PATH='${{ steps.bundle.outputs.sig }}'
          DMG_NAME="$(basename "$DMG_PATH")"
          TAR_NAME="$(basename "$TAR_PATH")"
          SIG_CONTENT="$(cat "$SIG_PATH")"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DMG_SIZE="$(stat -f%z "$DMG_PATH")"

          RELEASES_REPO='${{ vars.RELEASES_REPO }}'
          if [[ -z "$RELEASES_REPO" ]]; then
            # Fallback for first-run: matches the default repo name we
            # recommend in RELEASING.md. Override via repo variable
            # RELEASES_REPO if you name it differently.
            RELEASES_REPO="${{ github.repository_owner }}/focrel-releases"
          fi
          BASE="https://github.com/${RELEASES_REPO}/releases/download/${TAG}"
          TAR_URL="${BASE}/${TAR_NAME}"
          DMG_URL="${BASE}/${DMG_NAME}"

          # Custom fields (dmg, tag_name) sit alongside Tauri's required
          # shape — the updater ignores unknown keys, and /download reads
          # them for the version/size badge + download button URL.
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg pub_date "$PUB_DATE" \
            --arg tar_url "$TAR_URL" \
            --arg dmg_url "$DMG_URL" \
            --arg sig "$SIG_CONTENT" \
            --argjson dmg_size "$DMG_SIZE" \
            --rawfile notes RELEASE_NOTES.md \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-x86_64": { signature: $sig, url: $tar_url },
                "darwin-aarch64": { signature: $sig, url: $tar_url }
              },
              dmg: { url: $dmg_url, size_bytes: $dmg_size },
              tag_name: $tag
            }' > latest.json

          echo "--- latest.json ---"
          cat latest.json

      # --- Publish the DMG + updater tarball + signature + manifest as a
      # --- GitHub Release on the PUBLIC mirror repo. Anonymous clients
      # --- can read both the API listing and the asset download URLs
      # --- because that repo is public; the source repo stays private.
      # ---
      # --- The target repo is resolved from the `RELEASES_REPO` variable
      # --- (set at Repo → Settings → Actions → Variables). Token is the
      # --- `RELEASES_REPO_TOKEN` secret — a fine-grained PAT scoped to
      # --- the mirror repo with Contents: Write, nothing else. See
      # --- RELEASING.md for the exact token creation steps.
      - name: Publish release to focrel-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASES_REPO || format('{0}/focrel-releases', github.repository_owner) }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          # target_commitish is the ref the tag gets created on in the
          # target repo. The mirror repo has its own history (README,
          # maybe nothing else), so we pin this to its main branch.
          target_commitish: main
          name: Focrel ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          # body_path wins over generate_release_notes when both are set,
          # so our grouped changelog replaces GitHub's auto-generated one.
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.bundle.outputs.dmg }}
            ${{ steps.bundle.outputs.tar }}
            ${{ steps.bundle.outputs.sig }}
            latest.json

      # --- Nudge Cloudflare Pages to redeploy so /download picks up the
      # --- new version by pinging the existing deploy-web workflow via
      # --- workflow_dispatch. Requires `actions: write` in this
      # --- workflow's permissions (declared above). Fails loudly — if
      # --- this step is silently skipped the web gets stuck showing the
      # --- prior release for hours.
      - name: Trigger web redeploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-web.yml',
              ref: 'main',
            });
            core.info('Dispatched deploy-web.yml on main');
