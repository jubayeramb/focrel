name: Deploy web → Cloudflare Pages

# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN   — scope: Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — 32-char hex from Cloudflare dashboard
#
# One-time Cloudflare setup (run once from a local shell with wrangler logged in):
#   pnpm dlx wrangler pages project create focrel-web --production-branch=main
# After the first deploy, configure the custom domain (focrel.com) in
# Cloudflare dashboard → Pages → focrel-web → Custom domains.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/brand/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-web-${{ github.ref }}
  # Never cancel a deploy in flight — let it finish so Cloudflare's state
  # stays consistent. Next push queues behind it.
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://focrel.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web
        # Forward the workflow's auto-issued GITHUB_TOKEN so the /download
        # page's build-time GitHub Releases fetch can read the (private) repo.
        # Without this the API 404s on unauthenticated requests and the page
        # silently falls back to the "Release pending" card.
        env:
          GITHUB_RELEASES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @focrel/web build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Match the wrangler version pinned at repo root so the action
          # reuses the pre-installed binary instead of trying to install
          # its own (which trips the pnpm workspace-root guard).
          wranglerVersion: "4"
          command: pages deploy apps/web/out --project-name=focrel-web --branch=main --commit-dirty=true
