name: Deploy web → Cloudflare Pages

# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN   — scope: Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — 32-char hex from Cloudflare dashboard
#
# One-time Cloudflare setup (run once from a local shell with wrangler logged in):
#   pnpm dlx wrangler pages project create focrel-web --production-branch=main
# After the first deploy, configure the custom domain (focrel.com) in
# Cloudflare dashboard → Pages → focrel-web → Custom domains.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/brand/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-web-${{ github.ref }}
  # Never cancel a deploy in flight — let it finish so Cloudflare's state
  # stays consistent. Next push queues behind it.
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    # Skip path-triggered runs when the pushing commit is a release commit.
    # The release script bumps versions in apps/web/package.json +
    # packages/brand/package.json, which matches our path filter and would
    # otherwise kick off a web build immediately — while the desktop
    # release workflow is still building the DMG. That early deploy bakes
    # "Release pending" into the static HTML. The release-desktop workflow
    # re-fires us via workflow_dispatch after the GitHub Release is live,
    # and workflow_dispatch bypasses this guard.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        !startsWith(github.event.head_commit.message, 'chore(release):')
      }}
    environment:
      name: production
      url: https://focrel.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web
        # /download fetches the public `focrel-releases` repo's Releases API
        # at build time. No token plumbing here because that repo is public.
        run: pnpm --filter @focrel/web build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Match the wrangler version pinned at repo root so the action
          # reuses the pre-installed binary instead of trying to install
          # its own (which trips the pnpm workspace-root guard).
          wranglerVersion: "4"
          command: pages deploy apps/web/out --project-name=focrel-web --branch=main --commit-dirty=true
