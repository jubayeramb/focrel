[package]
name = "focrel"
version = "0.1.0"
description = "Local-first macOS context-switching focus app"
authors = ["Jubayer Al Mamun <jubayeramb@gmail.com>"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "focrel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

# OS bridge
wallpaper = "3"
rodio = { version = "0.19", default-features = false, features = ["mp3", "wav", "flac", "vorbis"] }

# Async + serde
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
ulid = { version = "1", features = ["serde"] }
log = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = 3
strip = "symbols"
