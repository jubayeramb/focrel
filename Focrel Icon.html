<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Focrel — App Icon v3</title>
<style>
  :root { --bg: #0e0f12; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    min-height: 100vh;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: #c9cdd6;
  }
  .stage {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    gap: 28px;
    padding: 48px;
    box-sizing: border-box;
  }
  header, .caption {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6c7280;
  }
  header b { color: #e7e9ef; font-weight: 500; letter-spacing: 0.08em; }

  main { display: grid; place-items: center; }
  .hero {
    width: 680px; height: 680px;
    display: grid; place-items: center;
    background:
      radial-gradient(circle at 50% 50%, rgba(140, 95, 220, 0.22), transparent 52%),
      radial-gradient(circle at 50% 50%, rgba(60, 170, 170, 0.10), transparent 70%);
    border-radius: 56px;
  }
  .icon-shadow {
    filter:
      drop-shadow(0 46px 68px rgba(40, 20, 80, 0.55))
      drop-shadow(0 14px 22px rgba(0, 0, 0, 0.40));
  }

  .variants {
    display: flex; gap: 48px;
    justify-content: center; align-items: flex-end;
  }
  .variant {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    color: #6c7280; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  }
  .variant svg { filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.45)); }
</style>
</head>
<body>
<div class="stage">

  <header>
    <span><b>Focrel</b> &nbsp;·&nbsp; macOS app icon · v3</span>
    <span>aperture · contracting into focus</span>
  </header>

  <main>
    <div class="hero">
      <svg class="icon-shadow" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- BODY: deep cool-to-warm wash. Starts teal at corners, deepens toward center. -->
          <radialGradient id="body" cx="50%" cy="50%" r="72%">
            <stop offset="0%"   stop-color="#2a1a55"/>
            <stop offset="35%"  stop-color="#1f2354"/>
            <stop offset="70%"  stop-color="#17434e"/>
            <stop offset="100%" stop-color="#1a5b5e"/>
          </radialGradient>

          <!-- Outer glass ring — calm teal glass -->
          <linearGradient id="ring1Fill" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#7ddcd2" stop-opacity="0.85"/>
            <stop offset="55%"  stop-color="#2f8a84" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#134f55" stop-opacity="0.85"/>
          </linearGradient>
          <linearGradient id="ring1Edge" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.7"/>
            <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.04"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
          </linearGradient>

          <!-- Middle ring — shifting from teal toward indigo -->
          <linearGradient id="ring2Fill" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#6f8edd" stop-opacity="0.85"/>
            <stop offset="55%"  stop-color="#3c4aa8" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#1f1b5e" stop-opacity="0.9"/>
          </linearGradient>
          <linearGradient id="ring2Edge" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.7"/>
            <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.04"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
          </linearGradient>

          <!-- Inner ring — amethyst, richer -->
          <linearGradient id="ring3Fill" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#b48aef" stop-opacity="0.9"/>
            <stop offset="55%"  stop-color="#6a3fc8" stop-opacity="0.75"/>
            <stop offset="100%" stop-color="#2e1260" stop-opacity="0.95"/>
          </linearGradient>
          <linearGradient id="ring3Edge" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
          </linearGradient>

          <!-- Core well: the deep realm -->
          <radialGradient id="core" cx="50%" cy="45%" r="60%">
            <stop offset="0%"   stop-color="#8d5fe0"/>
            <stop offset="45%"  stop-color="#4a2a9e"/>
            <stop offset="100%" stop-color="#160a38"/>
          </radialGradient>

          <!-- Focal bloom -->
          <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
            <stop offset="25%"  stop-color="#e8d4ff" stop-opacity="0.85"/>
            <stop offset="55%"  stop-color="#b890ff" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#6a3fc8" stop-opacity="0"/>
          </radialGradient>

          <!-- Top sheen on overall body -->
          <linearGradient id="sheen" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
            <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.04"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>

          <!-- Apple-style squircle -->
          <clipPath id="squircle">
            <path d="M 112 8
                     C 48 8, 8 48, 8 112
                     L 8 400
                     C 8 464, 48 504, 112 504
                     L 400 504
                     C 464 504, 504 464, 504 400
                     L 504 112
                     C 504 48, 464 8, 400 8 Z"/>
          </clipPath>
        </defs>

        <!-- Body -->
        <g clip-path="url(#squircle)">
          <rect width="512" height="512" fill="url(#body)"/>
          <!-- ambient washes -->
          <circle cx="120" cy="420" r="280" fill="#2fb3a5" opacity="0.10"/>
          <circle cx="392" cy="110" r="260" fill="#6a3fd2" opacity="0.14"/>
          <rect width="512" height="260" fill="url(#sheen)"/>

          <!-- ============================================
               APERTURE: three concentric rounded squares
               (plates of frosted glass), each rotated a
               bit from the next, collapsing toward center.
               Rotation gives the shutter-like feel.
               ============================================ -->

          <!-- Plate 1 — outermost, teal, rotated -18° -->
          <g transform="translate(256 256) rotate(-18)">
            <rect x="-170" y="-170" width="340" height="340" rx="60" ry="60"
                  fill="url(#ring1Fill)"/>
            <rect x="-170" y="-170" width="340" height="340" rx="60" ry="60"
                  fill="none" stroke="url(#ring1Edge)" stroke-width="1.75"/>
            <rect x="-170" y="-170" width="340" height="340" rx="60" ry="60"
                  fill="none" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
            <!-- specular -->
            <ellipse cx="-80" cy="-120" rx="80" ry="14" fill="#ffffff" opacity="0.18"
                     transform="rotate(-8 -80 -120)"/>
          </g>

          <!-- Plate 2 — middle, indigo, rotated +12° -->
          <g transform="translate(256 256) rotate(12)">
            <rect x="-124" y="-124" width="248" height="248" rx="48" ry="48"
                  fill="url(#ring2Fill)"/>
            <rect x="-124" y="-124" width="248" height="248" rx="48" ry="48"
                  fill="none" stroke="url(#ring2Edge)" stroke-width="1.75"/>
            <rect x="-124" y="-124" width="248" height="248" rx="48" ry="48"
                  fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>
            <ellipse cx="-60" cy="-88" rx="60" ry="10" fill="#ffffff" opacity="0.22"
                     transform="rotate(-6 -60 -88)"/>
          </g>

          <!-- Plate 3 — inner, amethyst, rotated -6° -->
          <g transform="translate(256 256) rotate(-6)">
            <rect x="-82" y="-82" width="164" height="164" rx="36" ry="36"
                  fill="url(#ring3Fill)"/>
            <rect x="-82" y="-82" width="164" height="164" rx="36" ry="36"
                  fill="none" stroke="url(#ring3Edge)" stroke-width="1.75"/>
            <rect x="-82" y="-82" width="164" height="164" rx="36" ry="36"
                  fill="none" stroke="rgba(0,0,0,0.40)" stroke-width="1"/>
            <ellipse cx="-38" cy="-58" rx="38" ry="7" fill="#ffffff" opacity="0.35"
                     transform="rotate(-6 -38 -58)"/>
          </g>

          <!-- ============================================
               Core circular "well" — deep realm
               ============================================ -->
          <circle cx="256" cy="256" r="54" fill="url(#core)"/>
          <!-- inner rim shadow -->
          <circle cx="256" cy="256" r="54" fill="none"
                  stroke="rgba(10,4,28,0.7)" stroke-width="2"/>
          <!-- subtle rim highlight top -->
          <path d="M 210 244 A 54 54 0 0 1 302 244"
                fill="none" stroke="rgba(255,255,255,0.35)"
                stroke-width="1.5" stroke-linecap="round"/>

          <!-- Focal bloom -->
          <circle cx="256" cy="256" r="82" fill="url(#bloom)" opacity="0.85"/>
          <circle cx="256" cy="256" r="28" fill="url(#bloom)"/>
          <!-- pin-sharp -->
          <circle cx="256" cy="256" r="6" fill="#ffffff"/>
          <circle cx="256" cy="256" r="2.5" fill="#ffffff"/>
        </g>

        <!-- Squircle edge stroke -->
        <path d="M 112 8 C 48 8, 8 48, 8 112 L 8 400 C 8 464, 48 504, 112 504 L 400 504 C 464 504, 504 464, 504 400 L 504 112 C 504 48, 464 8, 400 8 Z"
              fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      </svg>
    </div>
  </main>

  <p class="caption">
    <span>concentric glass plates · outer teal → inner amethyst · pulled to a single point</span>
    <span>aperture</span>
  </p>

  <div class="variants">
    <!-- 128 -->
    <div class="variant">
      <svg width="128" height="128" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <clipPath id="sq128"><path d="M112 8C48 8 8 48 8 112L8 400C8 464 48 504 112 504L400 504C464 504 504 464 504 400L504 112C504 48 464 8 400 8Z"/></clipPath>
        <g clip-path="url(#sq128)">
          <rect width="512" height="512" fill="url(#body)"/>
          <circle cx="120" cy="420" r="280" fill="#2fb3a5" opacity="0.10"/>
          <circle cx="392" cy="110" r="260" fill="#6a3fd2" opacity="0.14"/>
          <rect width="512" height="260" fill="url(#sheen)"/>
          <g transform="translate(256 256) rotate(-18)">
            <rect x="-170" y="-170" width="340" height="340" rx="60" fill="url(#ring1Fill)"/>
            <rect x="-170" y="-170" width="340" height="340" rx="60" fill="none" stroke="url(#ring1Edge)" stroke-width="1.75"/>
          </g>
          <g transform="translate(256 256) rotate(12)">
            <rect x="-124" y="-124" width="248" height="248" rx="48" fill="url(#ring2Fill)"/>
            <rect x="-124" y="-124" width="248" height="248" rx="48" fill="none" stroke="url(#ring2Edge)" stroke-width="1.75"/>
          </g>
          <g transform="translate(256 256) rotate(-6)">
            <rect x="-82" y="-82" width="164" height="164" rx="36" fill="url(#ring3Fill)"/>
            <rect x="-82" y="-82" width="164" height="164" rx="36" fill="none" stroke="url(#ring3Edge)" stroke-width="1.75"/>
          </g>
          <circle cx="256" cy="256" r="54" fill="url(#core)"/>
          <circle cx="256" cy="256" r="82" fill="url(#bloom)" opacity="0.85"/>
          <circle cx="256" cy="256" r="28" fill="url(#bloom)"/>
          <circle cx="256" cy="256" r="6" fill="#ffffff"/>
        </g>
      </svg>
      <span>128</span>
    </div>

    <!-- 64 -->
    <div class="variant">
      <svg width="64" height="64" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <clipPath id="sq64"><path d="M112 8C48 8 8 48 8 112L8 400C8 464 48 504 112 504L400 504C464 504 504 464 504 400L504 112C504 48 464 8 400 8Z"/></clipPath>
        <g clip-path="url(#sq64)">
          <rect width="512" height="512" fill="url(#body)"/>
          <g transform="translate(256 256) rotate(-18)">
            <rect x="-170" y="-170" width="340" height="340" rx="60" fill="url(#ring1Fill)"/>
          </g>
          <g transform="translate(256 256) rotate(12)">
            <rect x="-124" y="-124" width="248" height="248" rx="48" fill="url(#ring2Fill)"/>
          </g>
          <g transform="translate(256 256) rotate(-6)">
            <rect x="-82" y="-82" width="164" height="164" rx="36" fill="url(#ring3Fill)"/>
          </g>
          <circle cx="256" cy="256" r="54" fill="url(#core)"/>
          <circle cx="256" cy="256" r="70" fill="url(#bloom)"/>
          <circle cx="256" cy="256" r="8" fill="#ffffff"/>
        </g>
      </svg>
      <span>64</span>
    </div>

    <!-- 32 -->
    <div class="variant">
      <svg width="32" height="32" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <clipPath id="sq32"><path d="M112 8C48 8 8 48 8 112L8 400C8 464 48 504 112 504L400 504C464 504 504 464 504 400L504 112C504 48 464 8 400 8Z"/></clipPath>
        <g clip-path="url(#sq32)">
          <rect width="512" height="512" fill="url(#body)"/>
          <g transform="translate(256 256) rotate(-18)">
            <rect x="-170" y="-170" width="340" height="340" rx="60" fill="url(#ring1Fill)"/>
          </g>
          <g transform="translate(256 256) rotate(12)">
            <rect x="-124" y="-124" width="248" height="248" rx="48" fill="url(#ring2Fill)"/>
          </g>
          <g transform="translate(256 256) rotate(-6)">
            <rect x="-82" y="-82" width="164" height="164" rx="36" fill="url(#ring3Fill)"/>
          </g>
          <circle cx="256" cy="256" r="54" fill="url(#core)"/>
          <circle cx="256" cy="256" r="12" fill="#ffffff"/>
        </g>
      </svg>
      <span>32</span>
    </div>
  </div>

</div>
</body>
</html>
